<!DOCTYPE html>
<html lang="id">

<head>
    <meta charset="UTF-8">
    <title>Konvolusi & Histogram Equalization (Average RGB)</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 20px;
        }

        .channel-container {
            display: flex;
            gap: 10px;
            margin-top: 10px;
            flex-wrap: wrap;
        }

        .channel-block {
            text-align: center;
        }

        canvas {
            border: 1px solid #ddd;
            margin-top: 5px;
        }

        #resolution {
            margin-top: 10px;
        }

        button {
            margin-top: 5px;
            margin-right: 5px;
        }

        button:disabled {
            opacity: 0.6;
            cursor: not-allowed;
        }

        .hist-container {
            display: none;
            margin-top: 20px;
        }

        .hist-section {
            display: flex;
            flex-direction: column;
            margin-right: 20px;
            align-items: center;
        }

        table {
            border-collapse: collapse;
            width: 180px;
            font-size: 11px;
            max-height: 150px;
            display: block;
            overflow-y: scroll;
        }

        th,
        td {
            border: 1px solid #444;
            padding: 2px 4px;
            text-align: center;
        }

        th {
            background-color: #eee;
            position: sticky;
            top: 0;
        }
    </style>
</head>

<body>
    <h3>Konvolusi & Histogram Equalization (Average Color Channel)</h3>
    <canvas id="gambar" width="300" height="300"></canvas><br>
    <input type="file" id="file1" accept=".jpg,.jpeg,.png,.bmp"><br>
    <div id="resolution"></div>

    <button id="convBtn" onclick="applyConvolution()" disabled>Konvolusi</button>
    <button id="histBtn" onclick="histogramEqualization()" disabled>Histogram Equalization (Average RGB)</button>

    <div id="channels" class="channel-container"></div>
    <div id="histContainer" class="hist-container">
        <div style="display: flex; gap: 20px;">
            <div class="hist-section">
                <canvas id="histBefore" width="256" height="100"></canvas>
                <p>Histogram Sebelum (RGB)</p>
                <div id="tableBefore"></div>
            </div>
            <div class="hist-section">
                <canvas id="histAfter" width="256" height="100"></canvas>
                <p>Histogram Sesudah (RGB)</p>
                <div id="tableAfter"></div>
            </div>
        </div>
    </div>

    <script>
        let originalImage = null;
        let width = 0, height = 0;

        document.getElementById("file1").addEventListener("change", function () {
            loadImage(this, "gambar");
        });

        function loadImage(fileInput, canvasId) {
            const file = fileInput.files[0];
            if (!file) return;
            const canvas = document.getElementById(canvasId);
            const ctx = canvas.getContext("2d");
            const img = new Image();
            img.onload = function () {
                canvas.width = img.width;
                canvas.height = img.height;
                width = img.width;
                height = img.height;
                ctx.drawImage(img, 0, 0);
                originalImage = img;

                document.getElementById("convBtn").disabled = false;
                document.getElementById("histBtn").disabled = false;
                document.getElementById("resolution").textContent =
                    'Resolution: ' + img.width + ' x ' + img.height;
                clearChannels();
                document.getElementById("histContainer").style.display = "none";
            };
            img.src = URL.createObjectURL(file);
        }

        function clearChannels() {
            document.getElementById("channels").innerHTML = "";
        }

        function createChannelCanvas(label, imgData) {
            const container = document.getElementById("channels");
            const block = document.createElement("div");
            block.className = "channel-block";
            const canvas = document.createElement("canvas");
            canvas.width = width;
            canvas.height = height;
            const ctx = canvas.getContext("2d");
            ctx.putImageData(imgData, 0, 0);
            const caption = document.createElement("p");
            caption.textContent = label;
            block.appendChild(canvas);
            block.appendChild(caption);
            container.appendChild(block);
        }

        function applyConvolution() {
            if (!originalImage) return;
            clearChannels();
            document.getElementById("histContainer").style.display = "none";

            const canvas = document.getElementById("gambar");
            const ctx = canvas.getContext("2d");
            const imgData = ctx.getImageData(0, 0, width, height);

            const kernel = [
                [0, -1, 0],
                [-1, 5, -1],
                [0, -1, 0]
            ];
            const kSize = 3;
            const offset = Math.floor(kSize / 2);
            const newImgData = ctx.createImageData(width, height);

            for (let y = 0; y < height; y++) {
                for (let x = 0; x < width; x++) {
                    let r = 0, g = 0, b = 0;
                    for (let ky = 0; ky < kSize; ky++) {
                        for (let kx = 0; kx < kSize; kx++) {
                            const px = Math.min(width - 1, Math.max(0, x + kx - offset));
                            const py = Math.min(height - 1, Math.max(0, y + ky - offset));
                            const i = (py * width + px) * 4;
                            r += imgData.data[i] * kernel[ky][kx];
                            g += imgData.data[i + 1] * kernel[ky][kx];
                            b += imgData.data[i + 2] * kernel[ky][kx];
                        }
                    }
                    const i = (y * width + x) * 4;
                    newImgData.data[i] = Math.min(Math.max(r, 0), 255);
                    newImgData.data[i + 1] = Math.min(Math.max(g, 0), 255);
                    newImgData.data[i + 2] = Math.min(Math.max(b, 0), 255);
                    newImgData.data[i + 3] = 255;
                }
            }

            createChannelCanvas("Konvolusi", newImgData);
        }

        function getRGBHistograms(imgData) {
            const histR = new Array(256).fill(0);
            const histG = new Array(256).fill(0);
            const histB = new Array(256).fill(0);

            for (let i = 0; i < imgData.data.length; i += 4) {
                histR[imgData.data[i]]++;
                histG[imgData.data[i + 1]]++;
                histB[imgData.data[i + 2]]++;
            }
            return { histR, histG, histB };
        }

        function histogramEqualization() {
            if (!originalImage) return;
            clearChannels();
            const canvas = document.getElementById("gambar");
            const ctx = canvas.getContext("2d");
            const imgData = ctx.getImageData(0, 0, width, height);

            // 1. Tampilkan Histogram RGB Sebelum
            const histBefore = getRGBHistograms(imgData);
            document.getElementById("histContainer").style.display = "flex";
            drawRGBHistogram(histBefore.histR, histBefore.histG, histBefore.histB, "histBefore");
            drawRGBTable(histBefore.histR, histBefore.histG, histBefore.histB, "tableBefore");

            // 2. Ambil Average Color Channel per piksel
            const avgChannel = [];
            const rgbPixels = [];

            for (let i = 0; i < imgData.data.length; i += 4) {
                const r = imgData.data[i];
                const g = imgData.data[i + 1];
                const b = imgData.data[i + 2];

                const avg = Math.round((r + g + b) / 3);
                avgChannel.push(avg);
                rgbPixels.push({ r, g, b });
            }

            const histAvg = new Array(256).fill(0);
            avgChannel.forEach(v => histAvg[v]++);

            // Hitung CDF dari Average Channel
            const cdf = [];
            let sum = 0;
            const total = avgChannel.length;
            histAvg.forEach(v => {
                sum += v;
                cdf.push(sum / total);
            });

            const newImgData = ctx.createImageData(width, height);

            // 3. Terapkan Equalization menggunakan Average Channel scaling
            for (let i = 0; i < rgbPixels.length; i++) {
                const avg = avgChannel[i];
                const val = Math.round(cdf[avg] * 255);

                const { r, g, b } = rgbPixels[i];
                const factor = avg === 0 ? 0 : val / avg;

                const rNew = Math.min(255, Math.round(r * factor));
                const gNew = Math.min(255, Math.round(g * factor));
                const bNew = Math.min(255, Math.round(b * factor));

                const idx = i * 4;
                newImgData.data[idx] = rNew;
                newImgData.data[idx + 1] = gNew;
                newImgData.data[idx + 2] = bNew;
                newImgData.data[idx + 3] = 255;
            }

            // 4. Tampilkan Histogram RGB Sesudah
            const histAfter = getRGBHistograms(newImgData);

            createChannelCanvas("Histogram Equalization (Average RGB)", newImgData);
            drawRGBHistogram(histAfter.histR, histAfter.histG, histAfter.histB, "histAfter");
            drawRGBTable(histAfter.histR, histAfter.histG, histAfter.histB, "tableAfter");
        }

        function drawRGBHistogram(histR, histG, histB, canvasId) {
            const canvas = document.getElementById(canvasId);
            const ctx = canvas.getContext("2d");
            ctx.clearRect(0, 0, canvas.width, canvas.height);

            const maxVal = Math.max(...histR, ...histG, ...histB);
            if (maxVal === 0) return;

            // Kurva Merah
            ctx.strokeStyle = "rgba(255, 0, 0, 0.7)";
            ctx.beginPath();
            for (let i = 0; i < 256; i++) {
                const h = (histR[i] / maxVal) * canvas.height;
                if (i === 0) ctx.moveTo(i, canvas.height - h);
                else ctx.lineTo(i, canvas.height - h);
            }
            ctx.stroke();

            // Kurva Hijau
            ctx.strokeStyle = "rgba(0, 180, 0, 0.7)";
            ctx.beginPath();
            for (let i = 0; i < 256; i++) {
                const h = (histG[i] / maxVal) * canvas.height;
                if (i === 0) ctx.moveTo(i, canvas.height - h);
                else ctx.lineTo(i, canvas.height - h);
            }
            ctx.stroke();

            // Kurva Biru
            ctx.strokeStyle = "rgba(0, 0, 255, 0.7)";
            ctx.beginPath();
            for (let i = 0; i < 256; i++) {
                const h = (histB[i] / maxVal) * canvas.height;
                if (i === 0) ctx.moveTo(i, canvas.height - h);
                else ctx.lineTo(i, canvas.height - h);
            }
            ctx.stroke();
        }

        function drawRGBTable(histR, histG, histB, containerId) {
            const container = document.getElementById(containerId);
            container.innerHTML = "";
            let table = "<table><tr><th>Pixel</th><th>R</th><th>G</th><th>B</th></tr>";
            for (let i = 0; i < 256; i++) {
                table += "<tr><td>" + i + "</td><td>" + histR[i] + "</td><td>" + histG[i] + "</td><td>" + histB[i] + "</td></tr>";
            }
            table += "</table>";
            container.innerHTML = table;
        }
    </script>
</body>

</html>
